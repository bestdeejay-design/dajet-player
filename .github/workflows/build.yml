# One job, on the platform this app is for: does it build, does the app it
# makes stay inside the size it was given, and is it still nothing but Apple's
# own frameworks. The epic's rule is that the build is green before a wave is
# merged and green after it (joer#7), and a SwiftPM macOS app cannot be built
# anywhere but on a Mac — so this is that Mac.
#
# `./build.sh` is the same command the README gives anybody who wants the app,
# which is the point of running it here: a wave that builds with `swift build`
# and not with the script that makes the product has not been built.
#
# A failing build turns the compiler's own lines into annotations, so that what
# went wrong is readable from the pull request rather than only from a log that
# has to be opened in a browser.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version
          # The numbers a reader of the pull request is entitled to, without
          # having to open a log to get them: which Mac, and which Swift.
          echo "::notice title=toolchain::$(sw_vers -productVersion) · $(swift --version 2>&1 | head -1) · $(xcodebuild -version | tail -1)"

      # The budget in ROADMAP.md: a bundle under 15 MB. Debug first, because a
      # failure there says something about the code, and a failure in the
      # release build after it says something about the optimiser.
      - name: Build (debug)
        run: |
          set -o pipefail
          swift build 2>&1 | tee "$RUNNER_TEMP/1-debug.log"

      - name: Presentation regression tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/1-tests.log"

      - name: Build (release)
        run: |
          set -o pipefail
          swift build -c release -Xswiftc -Osize 2>&1 | tee "$RUNNER_TEMP/2-release.log"

      - name: Bundle the app
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/3-bundle.log"

      - name: Bundle stays under 15 MB
        run: |
          KB=$(du -sk build/DajetPlayer.app | cut -f1)
          echo "build/DajetPlayer.app is ${KB} KB"
          echo "::notice title=bundle::DajetPlayer.app is ${KB} KB of a 15360 KB budget"
          test "$KB" -le 15360

      # Zero-dep is a principle of the series, not a preference: only Apple's
      # frameworks, and a checkout folder that has anything in it is a
      # dependency that was added since.
      - name: No third-party dependencies
        run: |
          swift package show-dependencies
          test ! -d .build/checkouts || test -z "$(ls -A .build/checkouts)"

      - name: Nothing reaches the network
        run: |
          # The claim in the README, checked the cheap way: no session, no
          # socket, no address in the source. A URL that is a file on this Mac
          # is what every URL in here is.
          if grep -rnE 'URLSession|NSURLConnection|NWConnection|CFStreamCreatePairWithSocket|https?://' Sources; then
            echo "something in Sources looks like a network" >&2
            exit 1
          fi

      # The compiler's own words, where they can be read without opening a log
      # in a browser: one annotation per error and per warning, with the file
      # and the line, so that they land in the diff of the pull request as well.
      # A warning is not a failure and is not treated as one — but a warning
      # nobody can see is a warning nobody will ever fix.
      - name: What the compiler said
        if: always()
        run: |
          shopt -s nullglob
          said=0
          for log in "$RUNNER_TEMP"/*.log; do
            found=$(awk -v ws="${GITHUB_WORKSPACE%/}/" '
              function say(level, file, row, rest) {
                if (file == "") { printf "::%s::%s\n", level, rest }
                else { printf "::%s file=%s,line=%s::%s\n", level, file, row, rest }
              }
              /error: |warning: / {
                line = $0
                level = (line ~ /error: /) ? "error" : "warning"
                if (match(line, /^[^ ]+\.swift:[0-9]+:[0-9]+: (error|warning): /)) {
                  head = substr(line, RSTART, RLENGTH)
                  rest = substr(line, RSTART + RLENGTH)
                  split(head, part, ":")
                  file = part[1]
                  sub(ws, "", file)
                  say(level, file, part[2], rest)
                } else {
                  sub(ws, "", line)
                  say(level, "", "", line)
                }
              }
            ' "$log" | sort -u | head -80)
            if [ -n "$found" ]; then
              printf '%s\n' "$found"
              said=1
            fi
          done
          [ "$said" = 1 ] && touch "$RUNNER_TEMP/said"
          exit 0

      # Something failed that was not a line the compiler recognised: the tail
      # of the last log is better than silence.
      - name: The tail of what went wrong
        if: failure()
        run: |
          shopt -s nullglob
          if [ ! -f "$RUNNER_TEMP/said" ]; then
            for log in "$RUNNER_TEMP"/*.log; do last="$log"; done
            if [ -n "${last:-}" ]; then
              tail -12 "$last" | while IFS= read -r line; do
                printf '::error::%s\n' "${line//%/%%}"
              done
            fi
          fi
